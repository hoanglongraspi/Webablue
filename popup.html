<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WebAble Extension</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, sans-serif;
        min-width: 240px;
        max-width: 320px;
        background: linear-gradient(120deg, #66b3ff, #ffffff);
      }
      .container {
        margin: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      h3 {
        margin-bottom: 0.5rem;
        color: #333;
      }
      button {
        padding: 10px 16px;
        font-size: 14px;
        cursor: pointer;
        border-radius: 6px;
        border: none;
        background-color: #0066ee;
        color: #fff;
        margin-top: 10px;
        transition: background-color 0.3s;
      }
      button:hover {
        background-color: #004bbd;
      }
      .notice {
        font-size: 12px;
        color: #555;
        margin-top: 12px;
        line-height: 1.3;
      }
      .slider-container {
        margin-top: 6px;
        width: 80%;
        display: none; /* hidden by default, shown after toggle ON */
        flex-direction: column;
        align-items: center;
      }
      .slider-label {
        margin: 5px 0;
        font-size: 13px;
        color: #333;
      }
      input[type="range"] {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h3>WebAble Controls</h3>

      <!-- Voice, alt text, read alt text -->
      <button id="voiceToggleBtn">Toggle Voice Navigation</button>
      <button id="altTextToggleBtn">Toggle AI Alt Text</button>
      <button id="readAltTextToggleBtn">Toggle Alt Text Reading</button>

      <!-- Dyslexia toggle & slider -->
      <button id="dyslexiaToggleBtn">Dyslexia-Friendly Mode</button>
      <div id="fontSizeSliderContainer" class="slider-container" style="display:none;">
        <div class="slider-label">Text Size</div>
        <input type="range" id="dyslexiaFontSizeRange" min="14" max="30" value="18"/>
      </div>

      <!-- High Contrast Mode -->
      <button id="highContrastToggleBtn">High Contrast Mode</button>

      <!-- Focus lens & AI layout -->
      <button id="focusLensToggleBtn">Focus Lens Mode</button>
      <button id="accessibleLayoutBtn">Accessible Layout (AI)</button>

      <p class="notice">
        Use your voice to navigate or summarize pages.<br/>
        Right-click highlighted text to simplify it!<br/>
        Dyslexia font + slider, High Contrast, Focus Lens, & more.
      </p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
