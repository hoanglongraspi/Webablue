<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WebAble Extension</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, sans-serif;
        min-width: 240px;
        max-width: 320px;
        background: linear-gradient(120deg, #66b3ff, #ffffff);
      }
      .container {
        margin: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      h3 {
        margin-bottom: 0.5rem;
        color: #333;
      }
      button {
        padding: 10px 16px;
        font-size: 14px;
        cursor: pointer;
        border-radius: 6px;
        border: none;
        background-color: #0066ee;
        color: #fff;
        margin-top: 10px;
        transition: background-color 0.3s;
      }
      button:hover {
        background-color: #004bbd;
      }
      .notice {
        font-size: 12px;
        color: #555;
        margin-top: 12px;
        line-height: 1.3;
      }
      .slider-container {
        margin-top: 15px;
        width: 80%;
      }
      .level-label {
        margin-top: 5px;
        font-size: 14px;
        color: #333;
      }
      input[type="range"] {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h3>WebAble Controls</h3>

      <!-- Toggle voice navigation -->
      <button id="voiceToggleBtn">Toggle Voice Navigation</button>

      <!-- AI Alt Text Generation -->
      <button id="altTextToggleBtn">Toggle AI Alt Text</button>

      <!-- Read Alt Text on Click -->
      <button id="readAltTextToggleBtn">Toggle Alt Text Reading</button>

      <div class="slider-container">
        <label for="simplifyRange" class="level-label">Reading Level (1=Simple, 3=Original, 5=Advanced)</label>
        <input type="range" id="simplifyRange" min="1" max="5" value="3" />
      </div>

      <p class="notice">
        Use your voice to scroll, navigate, or summarize pages.<br/>
        Enable AI alt text for images & read them aloud!<br/>
        Adjust reading level with the slider.
      </p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
